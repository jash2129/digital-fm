# Render Blueprint for Max, the Digital Finance Manager (tavus-avatar/ only).
#
# Why Render and not Vercel: every live call's state (script position, pending turn commits,
# per-visitor conversations) lives in this server's memory, so all turns of a call must reach the
# same always-on Node process. See CLAUDE.md "Production hardening" -> "Hard constraint".
# Step-by-step setup: docs/DEPLOY-RENDER.md
services:
  - type: web
    name: max-finance-manager
    runtime: node
    # Free instance: sleeps after ~15 min with no traffic (the next visit waits ~1 min for it to
    # wake) and has no persistent disk. A call in progress keeps it awake. Switch to "starter" and
    # add a disk (see docs/DEPLOY-RENDER.md) if it must never sleep or call-log history matters.
    plan: free
    # Closest Render region to the Texas dealership
    region: ohio
    # The whole repo is checked out; the app also reads ../prompts at runtime
    rootDir: tavus-avatar
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    # Deploy only when you click "Manual Deploy". A deploy restarts the server, which ends any live
    # call, so it should never happen just because a commit landed on main.
    autoDeployTrigger: "off"
    # No disk on the free plan: call logs (what the Inspector reads) are lost whenever the server
    # sleeps, restarts or redeploys
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: EVENT_CONFIG
        value: digital-finance-manager
      # The shared sign-in password for the demo. Required: in production the app refuses every
      # /api request (503) until it is set.
      - key: DEMO_API_TOKEN
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: HEYGEN_AVATAR_ID
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEALERSHIP_NAME
        sync: false
      # Call log sheet (Make.com webhook, docs/MAKE-CALL-LOG.md). Leave unset to not send calls.
      - key: CALL_LOG_WEBHOOK_URL
        sync: false
      - key: CALL_LOG_SECRET
        sync: false
      # Server speech recognition (docs/DEPLOY-VERCEL.md, "Speech recognition"). Optional.
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: NEXT_PUBLIC_STT_ENGINE
        sync: false
